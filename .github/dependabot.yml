version: 2
updates:
  # Configuration for NuGet
  - package-ecosystem: "nuget"
    directory: "/ColorPal"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - ".NET"
      - "automerge"
    groups:
      blazor:
        patterns:
          - "Microsoft.AspNetCore.Components.*"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.Components.*"
        update-types:
          - "version-update:semver-major"

  # Configuration for npm
  - package-ecosystem: "npm"
    directory: "/ColorPal"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
      - "automerge"
